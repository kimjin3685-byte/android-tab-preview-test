name: Android tab preview
on:
  workflow_dispatch:
    inputs:
      password_diagnostic:
        description: 'Run password checks only (no Android or tunnel)'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PREVIEW_HTTP_PASSWORD: ${{ secrets.PREVIEW_HTTP_PASSWORD }}
      PREVIEW_VNC_PASSWORD: ${{ secrets.PREVIEW_VNC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Start protected Android preview
        shell: bash
        run: |
          set -euo pipefail
          password_valid() { [[ "$1" =~ ^[A-Za-z0-9]{32,128}$ ]]; }
          if [[ '${{ inputs.password_diagnostic }}' == 'true' ]]; then
            echo PASSWORD_DIAGNOSTIC_ONLY=TRUE
            failed=false
            check_case() {
              local label="$1" value="$2" expected="$3" actual=false
              if password_valid "$value"; then actual=true; fi
              if [[ "$actual" == "$expected" ]]; then echo "SYNTH_${label}=PASS"; else echo "SYNTH_${label}=FAIL"; failed=true; fi
            }
            printf -v p31 '%031d' 0
            printf -v p32 '%032d' 0
            printf -v p128 '%0128d' 0
            printf -v p129 '%0129d' 0
            check_case VALID_32 "$p32" true
            check_case VALID_128 "$p128" true
            check_case SHORT_31 "$p31" false
            check_case LONG_129 "$p129" false
            check_case SPECIAL "${p32:0:31}!" false
            check_case NEWLINE "$p32"$'\n' false
            if [[ -n "$PREVIEW_HTTP_PASSWORD" ]]; then echo SECRET_PRESENT=true; else echo SECRET_PRESENT=false; fi
            if (( ${#PREVIEW_HTTP_PASSWORD} >= 32 && ${#PREVIEW_HTTP_PASSWORD} <= 128 )); then echo SECRET_LENGTH_IN_RANGE=true; else echo SECRET_LENGTH_IN_RANGE=false; fi
            if [[ -n "$PREVIEW_HTTP_PASSWORD" && ! "$PREVIEW_HTTP_PASSWORD" =~ [^A-Za-z0-9] ]]; then echo SECRET_ALL_ASCII_ALNUM=true; else echo SECRET_ALL_ASCII_ALNUM=false; fi
            if [[ "$PREVIEW_HTTP_PASSWORD" =~ [[:space:]] ]]; then echo SECRET_HAS_WHITESPACE=true; else echo SECRET_HAS_WHITESPACE=false; fi
            if password_valid "$PREVIEW_HTTP_PASSWORD"; then echo SECRET_FORMAT_VALID=true; else echo SECRET_FORMAT_VALID=false; fi
            if [[ "$failed" == true ]]; then exit 1; fi
            exit 0
          fi
          umask 077
          T="$RUNNER_TEMP/android-preview"
          mkdir -m 700 "$T"
          mkdir -m 700 "$T/logs" "$T/body"
          export PREVIEW_ORIGIN_FILE="$RUNNER_TEMP/preview-origin"
          export DISPLAY=:99
          cleanup() {
            original_rc=$?
            set +e
            echo "CLEANUP_BEGIN ORIGINAL_EXIT=$original_rc"
            [ -n "${CF_PID:-}" ] && kill "$CF_PID" >/dev/null 2>&1
            [ -f "$T/nginx.pid" ] && nginx -p "$T/" -c "$T/nginx.conf" -s stop >/dev/null 2>&1
            command -v adb >/dev/null && timeout 10 adb -s emulator-5554 emu kill >/dev/null 2>&1
            for pid in ${UPLOAD_PID:-} ${WS_PID:-} ${VNC_PID:-} ${XVFB_PID:-} ${EMU_PID:-}; do kill "$pid" >/dev/null 2>&1; done
            for _ in $(seq 1 10); do
              alive=0
              for pid in ${CF_PID:-} ${UPLOAD_PID:-} ${WS_PID:-} ${VNC_PID:-} ${XVFB_PID:-} ${EMU_PID:-}; do kill -0 "$pid" 2>/dev/null && alive=1; done
              [ "$alive" = 0 ] && break
              sleep 1
            done
            for pid in ${CF_PID:-} ${UPLOAD_PID:-} ${WS_PID:-} ${VNC_PID:-} ${XVFB_PID:-} ${EMU_PID:-}; do
              kill -0 "$pid" 2>/dev/null && kill -KILL "$pid" >/dev/null 2>&1
              wait "$pid" 2>/dev/null
              if kill -0 "$pid" 2>/dev/null; then echo "CLEANUP_PROCESS=$pid STILL_PRESENT"; else echo "CLEANUP_PROCESS=$pid STOPPED"; fi
            done
            command -v adb >/dev/null && timeout 5 adb kill-server >/dev/null 2>&1
            rm -f "$PREVIEW_ORIGIN_FILE" "$T/vnc.pass" "$T/http.pass" "$RUNNER_TEMP"/preview-*.apk
            rm -rf "$T/body" "$T/avd"
            python3 - "$T" "$PREVIEW_ORIGIN_FILE" <<'PY_CLEANUP'
          import pathlib, subprocess, sys
          root, origin = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          remaining = any(p.exists() for p in (root / "http.pass", root / "vnc.pass", root / "body", root / "avd", origin)) or any(root.parent.glob("preview-*.apk"))
          print("CLEANUP_TEMP_FILES=" + ("REMAIN" if remaining else "REMOVED"))
          check = subprocess.run(["ss", "-H", "-ltn"], capture_output=True, text=True)
          ports = {"8080", "8081", "6080", "5900", "5554", "5555", "5037", "8554"}
          listening = [line.split()[3] for line in check.stdout.splitlines() if len(line.split()) >= 4 and line.split()[3].rsplit(":", 1)[-1] in ports]
          print("CLEANUP_PREVIEW_LISTENERS=" + ("CLOSED" if check.returncode == 0 and not listening else "UNCONFIRMED"))
          PY_CLEANUP
            echo "CLEANUP_END ORIGINAL_EXIT=$original_rc"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if [[ -n "$PREVIEW_HTTP_PASSWORD" ]]; then echo HTTP_PASSWORD_PRESENCE=PRESENT; else echo HTTP_PASSWORD_PRESENCE=ABSENT; fi
          if password_valid "$PREVIEW_HTTP_PASSWORD"; then echo HTTP_PASSWORD_FORMAT=PASS; else echo HTTP_PASSWORD_FORMAT=FAIL; exit 1; fi
          for required in openssl python3 ss; do command -v "$required" >/dev/null || { echo "STOP: required existing program missing: $required"; exit 1; }; done
          python3 - "$T/http.pass" <<'PY_AUTH_FILE'
          import os, pathlib, subprocess, sys
          result = subprocess.run(["openssl", "passwd", "-6", "-stdin"], input=os.environ["PREVIEW_HTTP_PASSWORD"] + "\n", text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if result.returncode or not result.stdout.startswith("$6$") or len(result.stdout.splitlines()) != 1:
              raise SystemExit("STOP: authentication file generation failed")
          with pathlib.Path(sys.argv[1]).open("x") as output:
              output.write("preview:" + result.stdout)
          os.chmod(sys.argv[1], 0o600)
          print("HTTP_AUTH_FILE=CREATED MODE=0600 USER=preview")
          PY_AUTH_FILE
          if [[ -n "$PREVIEW_VNC_PASSWORD" ]]; then echo 'PASSWORD_PRESENCE=PRESENT'; else echo 'PASSWORD_PRESENCE=ABSENT'; fi; if [[ "$PREVIEW_VNC_PASSWORD" =~ ^[A-Za-z0-9]{8}$ ]]; then echo 'PASSWORD_FORMAT=PASS'; else echo 'PASSWORD_FORMAT=FAIL'; fi; [[ "$PREVIEW_VNC_PASSWORD" =~ ^[A-Za-z0-9]{8}$ ]] || { echo 'STOP: VNC password must be eight letters or digits'; exit 1; }
          test -e /dev/kvm || { echo 'STOP: KVM device unavailable'; exit 1; }
          START="$(date +%s)"
          DEADLINE="$((START + 1500))"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb x11vnc x11-utils novnc websockify nginx curl libpulse0
          python3 -c 'import ctypes; ctypes.CDLL("libpulse.so.0"); print("LIBPULSE_LOADER=PASS")'
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          test -n "${ANDROID_HOME:-}"
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMAN="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMAN" && test -x "$AVDMAN"
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME"
          timeout 360 "$SDKMAN" --install emulator platform-tools 'system-images;android-30;google_apis;x86_64' </dev/null
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$T/avd"
          mkdir -m 700 "$ANDROID_AVD_HOME"
          printf 'no\n' | "$AVDMAN" create avd --name preview --package 'system-images;android-30;google_apis;x86_64' --device pixel_2
          Xvfb :99 -screen 0 1280x800x24 >"$T/xvfb.log" 2>&1 &
          XVFB_PID=$!
          for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 1; done
          xdpyinfo -display :99 >/dev/null
          x11vnc -storepasswd "$PREVIEW_VNC_PASSWORD" "$T/vnc.pass" >/dev/null
          x11vnc -display :99 -localhost -forever -shared -rfbauth "$T/vnc.pass" -rfbport 5900 >"$T/vnc.log" 2>&1 &
          VNC_PID=$!
          websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900 >"$T/websockify.log" 2>&1 &
          WS_PID=$!
          emulator @preview -accel on -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 >"$T/emulator.log" 2>&1 &
          EMU_PID=$!
          echo "EMULATOR_PID=$EMU_PID LAUNCH_OBSERVED_AT=$(date -u +%FT%TZ)"
          if kill -0 "$EMU_PID" 2>/dev/null; then
            echo EMULATOR_INITIAL_STATE=PRESENT
            ps -p "$EMU_PID" -o pid=,stat=,comm= || true
          else
            echo EMULATOR_INITIAL_STATE=EXITED_BEFORE_FIRST_OBSERVATION
          fi
          record_emu_exit() {
            if wait "$EMU_PID"; then emu_rc=0; else emu_rc=$?; fi
            echo "EMULATOR_EXIT_CODE=$emu_rc DETECTED_AT=$(date -u +%FT%TZ)"
          }
          diag_preview() {
            (
              set +e
              echo DIAG_START
              if kill -0 "$EMU_PID" 2>/dev/null; then
                echo EMULATOR_PROCESS=PRESENT
                ps -p "$EMU_PID" -o pid=,stat=,comm=
              else
                echo EMULATOR_PROCESS=ABSENT
              fi
              a="$(timeout 10 adb devices 2>/dev/null)"
              ar=$?
              echo "ADB_DEVICES_EXIT=$ar"
              s="$(printf '%s\n' "$a" | awk '$1=="emulator-5554" {print $2; exit}')"
              case "$s" in
                device|offline|unauthorized) echo "ADB_EMULATOR_STATE=$s" ;;
                '') echo ADB_EMULATOR_STATE=NOT_LISTED ;;
                *) echo ADB_EMULATOR_STATE=OTHER ;;
              esac
              for prop in sys.boot_completed dev.bootcomplete; do
                p="$(timeout 8 adb shell getprop "$prop" 2>/dev/null)"
                pr=$?
                p="$(printf '%s' "$p" | tr -d '\r')"
                case "$p" in
                  0|1) echo "PROPERTY_$prop=$p EXIT=$pr" ;;
                  '') echo "PROPERTY_$prop=EMPTY EXIT=$pr" ;;
                  *) echo "PROPERTY_$prop=OTHER EXIT=$pr" ;;
                esac
              done
              k="$(timeout 15 emulator -accel-check 2>&1)"
              kr=$?
              echo "ACCEL_CHECK_EXIT=$kr"
              if printf '%s\n' "$k" | grep -Eqi 'not usable|not installed|not supported|permission denied|failed|unavailable'; then
                echo ACCEL_CHECK=UNAVAILABLE_OR_ERROR
              elif printf '%s\n' "$k" | grep -Eqi 'KVM.*installed and usable'; then
                echo ACCEL_CHECK=KVM_USABLE
              else
                echo ACCEL_CHECK=OTHER
              fi
              echo MEMORY_MIB
              free -m
              echo DISK_MIB
              df -m "$RUNNER_TEMP"
              if [ -f "$T/emulator.log" ]; then
                echo EMULATOR_LOG=PRESENT
                python3 - "$T/emulator.log" <<'PY_LOG'
          import base64, os, pathlib, re, sys, urllib.parse
          try:
              text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
              names = ("PREVIEW_HTTP_PASSWORD", "PREVIEW_VNC_PASSWORD", "GITHUB_TOKEN", "GH_TOKEN", "ACTIONS_RUNTIME_TOKEN", "ACTIONS_ID_TOKEN_REQUEST_TOKEN")
              values = [os.environ.get(name, "") for name in names]
              masks = set()
              for value in values:
                  if value:
                      masks.update((value, urllib.parse.quote(value, safe=""), base64.b64encode(value.encode()).decode()))
              for value in sorted(masks, key=len, reverse=True):
                  text = text.replace(value, "[REDACTED]")
              text = re.sub(r"-----BEGIN [^-]*PRIVATE KEY-----.*?-----END [^-]*PRIVATE KEY-----", "[REDACTED PRIVATE KEY]", text, flags=re.S)
              text = re.sub(r"(?im)((?:authorization|cookie|set-cookie)\s*[:=]).*$", r"\1 [REDACTED]", text)
              text = re.sub(r"(?i)((?:password|passwd|token|secret|api[_-]?key|signature)\s*[=:]\s*)[^\s,;]+", r"\1[REDACTED]", text)
              text = re.sub(r"(https?://)[^/\s:@]+:[^@\s]+@", r"\1[REDACTED]@", text)
              text = re.sub(r"(https?://[^\s?]+)\?[^\s]+", r"\1?[REDACTED]", text)
              text = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|(?:AKIA|ASIA)[A-Z0-9]{16}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)\b", "[REDACTED]", text)
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              print("EMULATOR_SANITIZED_LOG_BEGIN")
              for line in text.splitlines():
                  safe = "".join(c if ord(c) >= 32 and ord(c) != 127 else "\\x%02x" % ord(c) for c in line)
                  print("EMULATOR_LOG | " + safe)
              print("EMULATOR_SANITIZED_LOG_END")
          except Exception:
              print("EMULATOR_LOG_CAPTURE_FAILED")
              sys.exit(1)
          PY_LOG
                log_rc=$?
                echo "EMULATOR_LOG_CAPTURE_EXIT=$log_rc"
                n="$(grep -Eic 'error|fatal|panic' "$T/emulator.log")"
                echo "EMULATOR_ERROR_FATAL_LINE_COUNT=$n"
                n="$(grep -Eic 'kvm|accel' "$T/emulator.log")"
                echo "EMULATOR_ACCEL_LINE_COUNT=$n"
                grep -Eio 'kvm (is )?(available|unavailable|enabled|disabled|supported|unsupported)|kvm acceleration (enabled|disabled)|acceleration (enabled|disabled)' "$T/emulator.log" | sort -u | sed 's/^/EMULATOR_ACCEL_MATCH=/'
                grep -Eio 'could not access kvm|kvm is not supported|failed to initialize egl|failed to initialize vulkan|out of memory|no space left on device|permission denied|segmentation fault' "$T/emulator.log" | sort -u | sed 's/^/EMULATOR_ERROR_MATCH=/'
              else
                echo EMULATOR_LOG=ABSENT
              fi
              echo DIAG_END
            )
          }
          echo "ADB_WAIT_START=$(date -u +%FT%TZ)"
          timeout 180 adb wait-for-device &
          ADB_WAIT_PID=$!
          adb_reason=WAIT_COMPLETED
          emu_failed=0
          while kill -0 "$ADB_WAIT_PID" 2>/dev/null; do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              record_emu_exit
              emu_failed=1
              adb_reason=EMULATOR_EXIT
              kill "$ADB_WAIT_PID" 2>/dev/null || true
              break
            fi
            sleep 1
          done
          if wait "$ADB_WAIT_PID"; then adb_rc=0; else adb_rc=$?; fi
          if [ "$emu_failed" = 0 ] && ! kill -0 "$EMU_PID" 2>/dev/null; then
            record_emu_exit
            emu_failed=1
            adb_reason=EMULATOR_EXIT
          fi
          echo "ADB_WAIT_END_REASON=$adb_reason"
          echo "ADB_WAIT_END=$(date -u +%FT%TZ) EXIT=$adb_rc"
          if [ "$emu_failed" = 1 ]; then
            echo BOOT_WAIT=NOT_RUN
            diag_preview
            if [ "$emu_rc" -eq 0 ]; then exit 1; else exit "$emu_rc"; fi
          fi
          if [ "$adb_rc" -ne 0 ]; then echo BOOT_WAIT=NOT_RUN; diag_preview; exit "$adb_rc"; fi
          echo "BOOT_WAIT_START=$(date -u +%FT%TZ)"
          if timeout 600 bash -c 'until value="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")"; case "$value" in 0|1) printf "BOOT_SYS_COMPLETED=%s\n" "$value";; "") echo BOOT_SYS_COMPLETED=EMPTY;; *) echo BOOT_SYS_COMPLETED=OTHER;; esac; [ "$value" = 1 ]; do sleep 5; done'; then boot_rc=0; else boot_rc=$?; fi
          echo "BOOT_WAIT_END=$(date -u +%FT%TZ) EXIT=$boot_rc"
          if [ "$boot_rc" -ne 0 ]; then
            if ! kill -0 "$EMU_PID" 2>/dev/null; then record_emu_exit; fi
            diag_preview
            exit "$boot_rc"
          fi
          echo 'ANDROID_BOOTED; KVM_AVAILABLE'
          python3 -u preview_upload.py >"$T/upload.log" 2>&1 &
          UPLOAD_PID=$!
          : >"$T/origin-status.log"
          cat >"$T/nginx.conf" <<'NGINX'
          pid nginx.pid;
          error_log /dev/null crit;
          events { worker_connections 64; }
          http {
            log_format minimal '$time_iso8601 $request_method $uri status=$status upstream_status=$upstream_status';
            access_log origin-status.log minimal;
            client_body_temp_path body;
            proxy_temp_path body/proxy;
            map $http_upgrade $connection_upgrade { default upgrade; '' close; }
            map $http_x_forwarded_proto $external_https { default 0; https 1; }
            map "$request_method:$http_upgrade" $need_origin { default 0; ~^POST: 1; ~^[^:]+:.+ 1; }
            map "$need_origin:$http_origin" $bad_origin {
              default 1;
              ~^0: 0;
              # PREVIEW_ORIGIN_ALLOW
            }
            server {
              listen 127.0.0.1:8080;
              auth_basic "Android preview";
              auth_basic_user_file http.pass;
              if ($external_https = 0) { return 403; }
              if ($bad_origin) { return 403; }
              client_max_body_size 20m;
              location = /apk {
                proxy_pass http://127.0.0.1:8081;
                proxy_http_version 1.1;
                proxy_set_header Authorization "";
                proxy_set_header Host $host;
                proxy_set_header Origin $http_origin;
              }
              location / {
                proxy_pass http://127.0.0.1:6080;
                proxy_http_version 1.1;
                proxy_set_header Authorization "";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_read_timeout 1800s;
              }
            }
          }
          NGINX
          nginx -t -p "$T/" -c "$T/nginx.conf"
          nginx -p "$T/" -c "$T/nginx.conf"
          python3 - "$T" <<'PY_LOCAL_AUTH'
          import base64, http.client, os, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          config = root.joinpath("nginx.conf").read_text()
          expected = ['listen 127.0.0.1:8080;', 'auth_basic "Android preview";', 'auth_basic_user_file http.pass;', 'if ($external_https = 0) { return 403; }', 'if ($bad_origin) { return 403; }']
          if not all(value in config for value in expected) or config.count('proxy_set_header Authorization "";') != 2 or 'auth_basic off' in config or 'satisfy any' in config:
              raise SystemExit("STOP: generated authentication configuration mismatch")
          print("NGINX_GENERATED_CONFIG_BEGIN\n" + config + "NGINX_GENERATED_CONFIG_END")
          headers = {"X-Forwarded-Proto": "https"}
          token = base64.b64encode(("preview:" + os.environ["PREVIEW_HTTP_PASSWORD"]).encode()).decode()
          for path in ("/vnc.html", "/apk"):
              for authenticated, expected_status in ((False, 401), (True, 200)):
                  request_headers = dict(headers)
                  if authenticated:
                      request_headers["Authorization"] = "Basic " + token
                  conn = http.client.HTTPConnection("127.0.0.1", 8080, timeout=10)
                  conn.request("GET", path, headers=request_headers)
                  response = conn.getresponse()
                  status = response.status
                  response.read()
                  conn.close()
                  print(f"LOCAL_AUTH path={path} authenticated={authenticated} status={status}")
                  if status != expected_status:
                      raise SystemExit("STOP: local authentication readiness failed")
          sockets = subprocess.run(["ss", "-H", "-ltn"], capture_output=True, text=True, check=True)
          ports = {"8080", "8081", "6080", "5900", "5554", "5555", "5037", "8554"}
          observed = set()
          for line in sockets.stdout.splitlines():
              fields = line.split()
              address = fields[3]
              host, _, port = address.rpartition(":")
              if port in ports:
                  observed.add(port)
                  if host not in ("127.0.0.1", "[::1]", "::1"):
                      raise SystemExit("STOP: preview listener is not loopback: " + address)
          if not {"8080", "8081", "6080", "5900", "5037"} <= observed:
              raise SystemExit("STOP: expected preview listeners missing")
          print("PREVIEW_LISTENERS=LOOPBACK_ONLY")
          PY_LOCAL_AUTH
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64 -o "$T/cloudflared"
          printf '%s  %s\n' '1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872' "$T/cloudflared" | sha256sum --check -
          chmod 700 "$T/cloudflared"
          "$T/cloudflared" tunnel --url http://127.0.0.1:8080 >"$T/cloudflared.log" 2>&1 &
          CF_PID=$!
          echo "CLOUDFLARED_PID=$CF_PID STARTED_AT=$(date -u +%FT%TZ)"
          tunnel_log() {
            python3 - "$T/cloudflared.log" <<'PY_CF_LOG'
          import base64, os, pathlib, re, sys, urllib.parse
          try:
              text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
              masks = set()
              for name in ("PREVIEW_HTTP_PASSWORD", "PREVIEW_VNC_PASSWORD", "GITHUB_TOKEN", "GH_TOKEN", "ACTIONS_RUNTIME_TOKEN", "ACTIONS_ID_TOKEN_REQUEST_TOKEN"):
                  value = os.environ.get(name, "")
                  if value:
                      masks.update((value, urllib.parse.quote(value, safe=""), base64.b64encode(value.encode()).decode()))
              for value in sorted(masks, key=len, reverse=True):
                  text = text.replace(value, "[REDACTED]")
              text = re.sub(r"-----BEGIN [^-]*PRIVATE KEY-----.*?-----END [^-]*PRIVATE KEY-----", "[REDACTED PRIVATE KEY]", text, flags=re.S)
              text = re.sub(r"(?im)((?:authorization|cookie|set-cookie)\s*[:=]).*$", r"\1 [REDACTED]", text)
              text = re.sub(r"(?i)((?:password|passwd|token|secret|api[_-]?key|signature)\s*[=:]\s*)[^\s,;]+", r"\1[REDACTED]", text)
              text = re.sub(r"(https?://)[^/\s:@]+:[^@\s]+@", r"\1[REDACTED]@", text)
              text = re.sub(r"(https?://[^\s?]+)\?[^\s]+", r"\1?[REDACTED]", text)
              text = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|(?:AKIA|ASIA)[A-Z0-9]{16}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)\b", "[REDACTED]", text)
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              print("TUNNEL_SANITIZED_LOG_BEGIN")
              for line in text.splitlines():
                  safe = "".join(c if ord(c) >= 32 and ord(c) != 127 else "\\x%02x" % ord(c) for c in line)
                  print("TUNNEL_LOG | " + safe)
              print("TUNNEL_SANITIZED_LOG_END")
          except Exception:
              print("TUNNEL_LOG_CAPTURE_FAILED")
              sys.exit(1)
          PY_CF_LOG
          }
          require_cf_alive() {
            if ! kill -0 "$CF_PID" 2>/dev/null; then
              if wait "$CF_PID"; then cf_rc=0; else cf_rc=$?; fi
              echo "CLOUDFLARED_EXIT_CODE=$cf_rc DETECTED_AT=$(date -u +%FT%TZ)"
              tunnel_log || true
              if [ "$cf_rc" -eq 0 ]; then exit 1; else exit "$cf_rc"; fi
            fi
          }
          URL=''
          for _ in $(seq 1 60); do require_cf_alive; URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$T/cloudflared.log" | head -n 1 || true)"; [ -n "$URL" ] && break; sleep 1; done
          require_cf_alive
